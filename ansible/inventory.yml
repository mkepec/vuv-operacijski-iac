all:
  children:
    reposervers:
      hosts:
        repo:
          ansible_host: 172.16.16.121
    students:
      vars:
        # Group vars — identical across all students
        exam_repo_url: "http://172.16.16.121/repo"
        exam_service_enable: crond
        exam_service_disable: rsyslog
        exam_package_remove: tmux
        exam_package_required: vim-enhanced
        exam_find_dir_size: /etc
        exam_find_dir_perms: /var
        exam_planted_data_dir: /var/exam-data
        exam_planted_etc_dir: /etc/exam-data
        # RH134 group vars — identical across all students
        exam_service_list: "sshd crond chronyd rsyslog"
        rh134_base_image: registry.access.redhat.com/ubi9/httpd-24
        rh134_nfs_mount_options: "rw,sync,vers=4"
        rh134_exam_source_anchor: manifest.txt
        rh134_nfs_welcome_anchor: welcome.txt
      hosts:
        student-01:
          ansible_host: 172.16.16.101
          exam_variant: alpha
          exam_dir: exam-alpha
          exam_username: dbadmin1
          exam_gid: 40001
          exam_expiry: "2026-11-30"
          exam_workspace: dbteam-workspace-alpha
          exam_mount: /mnt/exam-disk-alpha
          exam_mount_text: "alpha disk mounted"
          exam_extra_package: tree
          rh134_vg_name: vg_alpha
          rh134_lv_name: lv_alpha
          rh134_lv_initial_size: 300M
          rh134_lv_extend_size: 500M
          rh134_mount_point: /storage/alpha
          rh134_rsyslog_facility: local0
          rh134_rsyslog_priority: warning
          rh134_log_file: /var/log/alpha-events
          rh134_nfs_export_dir: export-alpha
          rh134_nfs_local_mount: /remote/alpha
          rh134_podman_port: 8101
          rh134_podman_image_text: "alpha containerized webserver"
          rh134_backup_dir: backup-alpha
          rh134_script_name: collect-alpha.sh
          rh134_report_file: /home/student/reports/alpha-status.txt
