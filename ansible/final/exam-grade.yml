---
# Instructor post-exam grading playbook — final combined exam (RH124+RH134)
# Runs the grade script on each student VM and writes per-host JSON to exam-results/final/.
#
# Usage:
#   ansible-playbook final/exam-grade.yml             # all students
#   ansible-playbook final/exam-grade.yml -l student-01  # single student
#
# Output: ansible/exam-results/final/<hostname>.json
#
# After grading, generate the report:
#   python3 scripts/exam-report.py --course final
#   python3 scripts/exam-report.py --course final --students scripts/students-final-<date>.csv

- name: Grade final exam — student-side checks
  hosts: students
  become: true
  gather_facts: false

  vars:
    results_dir: "{{ playbook_dir }}/../exam-results/final"

  tasks:
    # T10's checks call `podman images`/`podman ps`/`systemctl --user`, which
    # require the student's rootless session environment (XDG_RUNTIME_DIR +
    # DBUS_SESSION_BUS_ADDRESS). Running become_user: student with an explicit
    # chdir: /tmp ensures we land in a directory the student can access.
    - name: Run grade script on student VM
      ansible.builtin.command: /usr/local/bin/grade all
      args:
        chdir: /tmp
      become_user: student
      environment:
        XDG_RUNTIME_DIR: /run/user/1001
        DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1001/bus
      register: grade_output
      changed_when: false
      failed_when: false

    - name: Save raw grade output to controller
      delegate_to: localhost
      become: false
      ansible.builtin.copy:
        dest: "{{ results_dir }}/.raw_{{ inventory_hostname }}.txt"
        content: "{{ grade_output.stdout }}"
        mode: "0600"

- name: Grade final exam — parse results
  hosts: students
  become: false
  gather_facts: false

  vars:
    results_dir: "{{ playbook_dir }}/../exam-results/final"

  tasks:
    - name: Parse grade output into JSON
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../../scripts/parse-grade-output.py"
          - "--host"
          - "{{ inventory_hostname }}"
          - "--variant"
          - "none"
          - "--course"
          - "final"
          - "--input"
          - "{{ results_dir }}/.raw_{{ inventory_hostname }}.txt"
          - "--output"
          - "{{ results_dir }}/{{ inventory_hostname }}.json"
      changed_when: true

    - name: Remove temp raw file
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: "{{ results_dir }}/.raw_{{ inventory_hostname }}.txt"
        state: absent

    - name: Show score summary
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json
            with open("{{ results_dir }}/{{ inventory_hostname }}.json") as f:
                d = json.load(f)
            print(f"{{ inventory_hostname }}: {d['total']}/165")
      register: score_line
      changed_when: false

    - name: Print score
      delegate_to: localhost
      become: false
      ansible.builtin.debug:
        msg: "{{ score_line.stdout }}"
